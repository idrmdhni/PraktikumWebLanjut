{% load static %}
{% load socialaccount %}

<!DOCTYPE html>
<html lang="en" itemscope itemtype="http://schema.org/WebPage">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="apple-touch-icon" sizes="76x76" href="{% static 'landingpage' %}/assets/img/apple-icon.png' %}" />
    <link rel="icon" type="image/png" href="{% static 'landingpage/assets/img/favicon.png' %}" />
    <title>{{ title }}</title>
    <!-- Fonts and icons -->
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900|Roboto+Slab:400,700" />
    <!-- Nucleo Icons -->
    <link href="{% static 'landingpage/assets/css/nucleo-icons.css' %}" rel="stylesheet" />
    <link href="{% static 'landingpage/assets/css/nucleo-svg.css' %}" rel="stylesheet" />
    <!-- Font Awesome Icons -->
    <script src="https://kit.fontawesome.com/d1b46a630d.js' %}" crossorigin="anonymous"></script>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <!-- CSS Files -->
    <link id="pagestyle" href="{% static 'landingpage/assets/css/material-kit-pro.css' %}?v=3.0.0" rel="stylesheet" />
  </head>

  <body class="sign-in-basic">
    <!-- Navbar Transparent -->
    <nav class="navbar navbar-expand-lg position-absolute top-0 z-index-3 w-100 shadow-none my-3 navbar-transparent">
      <div class="container d-flex justify-content-between">
        <a class="navbar-brand text-white" href="/" rel="tooltip" title="Designed and Coded by Creative Tim" data-placement="bottom">My Blog Login</a>

        <ul class="navbar-nav d-lg-block d-none">
          <li class="nav-item">
            <a href="/" class="btn btn-sm bg-gradient-primary mb-0 me-1">HOME</a>
          </li>
        </ul>
      </div>
    </nav>
    <!-- End Navbar -->
    <!-- End Navbar -->
    <section>
      <div class="page-header min-vh-100" style="background-image: url('https://images.unsplash.com/photo-1497294815431-9365093b7331?ixlib=rb-1.2.1&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1950&q=80');" loading="lazy">
        <span class="mask bg-gradient-dark opacity-6"></span>
        <div class="container">
          <div class="row">
            <div class="col-xl-4 col-lg-5 col-md-7 mx-auto">
              <div class="card z-index-0 mt-7">
                <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
                  <div class="bg-gradient-primary shadow-primary border-radius-lg text-center p-4">
                    <h4 class="font-weight-bolder mt-1 mb-0 text-white">LOGIN</h4>
                    <p class="mb-1 text-sm text-white">{{ message }}</p>
                  </div>
                </div>
                <div class="card-body pb-0 mt-1">
                  <form role="form" method="post">
                    {% csrf_token %}
                    <div class="input-group input-group-outline mb-3">
                      <label class="form-label">Username</label>
                      <input type="text" name="username" class="form-control" required />
                    </div>
                    <div class="input-group input-group-outline mb-4">
                      <label class="form-label">Password</label>
                      <input type="password" name="password" class="form-control" required />
                    </div>
                    {% comment %} <a href="{% provider_login_url 'google' %}">Login dengan Google</a> {% endcomment %}
                    <a class="btn bg-gradient-primary w-100 p-2 d-flex align-items-center justify-content-center gap-2 mb-2" href="{% provider_login_url 'google' %}">
                      <span>Login dengan akun google</span>
                      <div class="rounded-circle bg-white p-1 d-inline-block" style="width: 22px; height: 22px;">
                        <svg width="18px" viewBox="0 0 64 64" transform="translate(-1.25, -3)" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                          <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                            <g id="google-icon" fill-rule="nonzero">
                              <path d="M57.8123233,30.1515267 C57.8123233,27.7263183 57.6155321,25.9565533 57.1896408,24.1212666 L29.4960833,24.1212666 L29.4960833,35.0674653 L45.7515771,35.0674653 C45.4239683,37.7877475 43.6542033,41.8844383 39.7213169,44.6372555 L39.6661883,45.0037254 L48.4223791,51.7870338 L49.0290201,51.8475849 C54.6004021,46.7020943 57.8123233,39.1313952 57.8123233,30.1515267" fill="#4285F4"></path>
                              <path d="M29.4960833,58.9921667 C37.4599129,58.9921667 44.1456164,56.3701671 49.0290201,51.8475849 L39.7213169,44.6372555 C37.2305867,46.3742596 33.887622,47.5868638 29.4960833,47.5868638 C21.6960582,47.5868638 15.0758763,42.4415991 12.7159637,35.3297782 L12.3700541,35.3591501 L3.26524241,42.4054492 L3.14617358,42.736447 C7.9965904,52.3717589 17.959737,58.9921667 29.4960833,58.9921667" fill="#34A853"></path>
                              <path d="M12.7159637,35.3297782 C12.0932812,33.4944915 11.7329116,31.5279353 11.7329116,29.4960833 C11.7329116,27.4640054 12.0932812,25.4976752 12.6832029,23.6623884 L12.6667095,23.2715173 L3.44779955,16.1120237 L3.14617358,16.2554937 C1.14708246,20.2539019 0,24.7439491 0,29.4960833 C0,34.2482175 1.14708246,38.7380388 3.14617358,42.736447 L12.7159637,35.3297782" fill="#FBBC05"></path>
                              <path d="M29.4960833,11.4050769 C35.0347044,11.4050769 38.7707997,13.7975244 40.9011602,15.7968415 L49.2255853,7.66898166 C44.1130815,2.91684746 37.4599129,0 29.4960833,0 C17.959737,0 7.9965904,6.62018183 3.14617358,16.2554937 L12.6832029,23.6623884 C15.0758763,16.5505675 21.6960582,11.4050769 29.4960833,11.4050769" fill="#EB4335"></path>
                            </g>
                          </g>
                        </svg>
                      </div>
                    </a>
                    <div class="text-center">
                      <button type="submit" class="btn bg-gradient-primary w-100 mb-2">Login</button>
                    </div>
                  </form>
                </div>
                <div class="card-footer text-center pt-0 px-sm-4 px-1">
                  <p class="mb-0 mt-3 text-sm mx-auto">
                    Belum punya akun?
                    <a href="auth-register" class="text-primary text-gradient font-weight-bold">Registrasi</a>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Core JS Files -->
    <script src="{% static 'landingpage/assets/js/core/popper.min.js' %}" type="text/javascript"></script>
    <script src="{% static 'landingpage/assets/js/core/bootstrap.min.js' %}" type="text/javascript"></script>
    <script src="{% static 'landingpage/assets/js/plugins/perfect-scrollbar.min.js' %}"></script>
    <!-- Plugin for TypedJS, full documentation here: https://github.com/mattboldt/typed.js/ -->
    <script src="{% static 'landingpage/assets/js/plugins/typedjs.js' %}"></script>
    <!-- Plugin for Parallax, full documentation here: https://github.com/wagerfield/parallax -->
    <script src="{% static 'landingpage/assets/js/plugins/parallax.min.js' %}"></script>
    <!-- Plugin for the Sliders, full documentation here: http://refreshless.com/nouislider/ -->
    <script src="{% static 'landingpage/assets/js/plugins/nouislider.min.js' %}" type="text/javascript"></script>
    <!-- Plugin for the blob animation -->
    <script src="{% static 'landingpage/assets/js/plugins/anime.min.js' %}" type="text/javascript"></script>
    <!-- Control Center for Material UI Kit: parallax effects, scripts for the example pages etc -->
    <!-- Google Maps Plugin -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDTTfWur0PDbZWPr7Pmq8K3jiDp0_xUziI"></script>
    <script src="{% static 'landingpage/assets/js/material-kit-pro.min.js' %}?v=3.0.0" type="text/javascript"></script>
  </body>
</html>
