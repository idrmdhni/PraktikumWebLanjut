{% extends 'dashboard/base.html' %}
{% load static %}

{% block content %}
  <div class="row mt-4">
    <div class="col-lg-9 col-12 mx-auto position-relative">
      <div class="card">
        <div class="card-header p-3 pt-2">
          <div class="icon icon-lg icon-shape bg-gradient-dark shadow text-center border-radius-xl mt-n4 me-3 float-start">
            <i class="material-icons opacity-10">user</i>
          </div>
          <h6 class="mb-0">Edit User</h6>
        </div>
        <div class="card-body pt-2">
          <form method="post">
            {% csrf_token %}
            <div class="input-group input-group-dynamic">
              <input type="text" value="{{ user.username }}" class="form-control" disabled />
            </div>
            <div for="firstName" class="input-group input-group-dynamic">
              <input name="first_name" type="text" value="{{ user.first_name }}" class="form-control" placeholder="Masukkan nama depan..."/>
            </div>
            <div for="lastName" class="input-group input-group-dynamic">
              <input name="last_name" type="text" value="{{ user.last_name }}" class="form-control" placeholder="Masukkan nama belakang..."/>
            </div>
            <div class="input-group input-group-dynamic">
              Is staff? &nbsp;<input name="is_staff" type="checkbox" {% if user.is_staff %}checked{% endif %}/>
            </div>

            <label class="form-label">Daftar Grup</label>
            {% for group in all_groups %}
              <div class="form-check">
                <input type="checkbox" class="form-check-input" name="groups" value="{{ group.id }}" id="group_{{ group.id }}" {% if group.name in group_user %}checked{% endif %}>
                <label for="group_{{ group.id }}" class="form-check-label">{{ group.name }}</label>
              </div>
            {% endfor %}
            <div class="d-flex justify-content-end mt-4">
              <button type="submit" name="button" class="btn bg-gradient-dark m-0 ms-2">Simpan</button>
              <a href="{% url 'admin_management_user_list' %}" class="btn bg-gradient-dark m-0 ms-2">Kembali</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block js %}
  <script src="{% static 'dashboard/assets/js/plugins/choices.min.js' %}"></script>
  <script src="{% static 'dashboard/assets/js/plugins/quill.min.js' %}"></script>
  <script src="{% static 'dashboard/assets/js/plugins/flatpickr.min.js' %}"></script>
  <script src="{% static 'dashboard/assets/js/plugins/dropzone.min.js' %}"></script>
  <script>
    if (document.getElementById('editor')) {
      var quill = new Quill('#editor', {
        theme: 'snow' // Specify theme in configuration
      })
    }
    
    if (document.getElementById('choices-multiple-remove-button')) {
      var element = document.getElementById('choices-multiple-remove-button')
      const example = new Choices(element, {
        removeItemButton: true
      })
    
      example.setChoices(
        [
          {
            value: 'One',
            label: 'Label One',
            disabled: true
          },
          {
            value: 'Two',
            label: 'Label Two',
            selected: true
          },
          {
            value: 'Three',
            label: 'Label Three'
          }
        ],
        'value',
        'label',
        false
      )
    }
    
    if (document.querySelector('.datetimepicker')) {
      flatpickr('.datetimepicker', {
        allowInput: true
      }) // flatpickr
    }
    
    Dropzone.autoDiscover = false
    var drop = document.getElementById('dropzone')
    var myDropzone = new Dropzone(drop, {
      url: '/file/post',
      addRemoveLinks: true
    })
  </script>
{% endblock %}
